[project]
name = "qq-cli"
version = "0.1.0"
description = "查询本地 QQ (NT) 数据，专为 AI Agent 集成设计"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "click>=8.0",
    "sqlcipher3>=0.6.4",
]

[project.scripts]
qq-cli = "qq_cli.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qq_cli*"]
